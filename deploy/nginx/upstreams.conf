# /etc/nginx/conf.d/originforge-upstreams.conf (http level). Installed by
# configure_nginx.sh, refreshed by update.sh.

upstream originforge_django { server 127.0.0.1:8000 fail_timeout=0; }
upstream originforge_next   { server 127.0.0.1:3000 fail_timeout=0; }

# Script libraries that never disguise themselves (same list as MediGate):
# turned away before they reach Django or Next.
map $http_user_agent $of_bad_ua {
    default 0;
    ""      1;
    "~*(curl|wget|python-requests|python-urllib|aiohttp|scrapy|go-http-client|okhttp|libwww-perl|postmanruntime|apache-httpclient|\bjava/|^php|^ruby|typhoeus|guzzlehttp|insomnia|http\.rb|^axios|node-fetch|node-superagent|urlgrabber|mechanize|httpx|winhttp|masscan|^nmap|nikto|sqlmap|dirbuster|zgrab)" 1;
}

# Next's own Cache-Control is kept when it gives browsers a lifetime (hashed
# assets, images, private pages say max-age). Prerendered pages only say
# s-maxage + stale-while-revalidate, which a browser reads as "show the old
# copy, refresh behind": a deploy or a content edit would show one visit
# late. Those revalidate on every visit instead (the server keeps its cache).
map $upstream_http_cache_control $of_cache_control {
    default        "private, no-cache";
    "~max-age"     $upstream_http_cache_control;
}

# WebSocket upgrade, only when the browser asks for one.
map $http_upgrade $of_connection {
    default upgrade;
    ""      close;
}
