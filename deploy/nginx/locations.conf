# /etc/nginx/snippets/originforge-locations.conf (server level). Installed by configure_nginx.sh.
#
#   /ws/                          -> Django, upgraded to a WebSocket (live updates)
#   /api/ /webhooks/ /_djadmin/   -> Django (ASGI)
#   /media/                       -> files on disk (public work media, hotlink-protected)
#   /_private/                    -> internal only: client files, after Django says yes
#   /.well-known/acme-challenge/  -> certificate checks (works over HTTP and HTTPS)
#   everything else               -> Next.js

client_max_body_size 30m;   # UPLOAD_MAX_BYTES is 25 MB
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
}

# Live notifications, conversations and progress (backend/live). Long
# timeout: the socket stays open; the browser pings every 25 s.
location /ws/ {
    proxy_pass http://originforge_django;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $of_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

location ~ ^/(api|webhooks|_djadmin)/ {
    if ($of_bad_ua) { return 403; }
    proxy_pass http://originforge_django;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Public work media (the galaxy, case studies, films), from disk with a long
# cache. Other sites can't embed it (hotlink protection) and the player never
# offers a download; a determined visitor can still save what their browser
# plays, so this stops casual copying only.
location /media/ {
    alias /srv/originforge/media/;
    # `server_names` covers every name in server_name.
    valid_referers none blocked server_names;
    if ($invalid_referer) { return 403; }
    add_header Cache-Control "public, max-age=2592000";
    add_header Content-Disposition "inline";
    add_header X-Content-Type-Options "nosniff";
    mp4;
}

# Client attachments and receipts: only through Django's access check, which
# answers with X-Accel-Redirect (PRIVATE_MEDIA_ACCEL_PREFIX=/_private).
location /_private/ {
    internal;
    alias /srv/originforge/private_media/;
    add_header Cache-Control "private, no-store";
    add_header X-Content-Type-Options "nosniff";
    # A file opened on its own runs nothing, even if a check upstream ever lets a page through.
    add_header Content-Security-Policy "sandbox; default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'";
}

location / {
    if ($of_bad_ua) { return 403; }
    proxy_pass http://originforge_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_hide_header Cache-Control;
    add_header Cache-Control $of_cache_control always;
}
